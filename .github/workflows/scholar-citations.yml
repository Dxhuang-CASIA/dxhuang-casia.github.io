name: Check citation data

on:
  # Scholar fetching runs on the owner's Mac; cloud runners returned HTTP 403.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/sync_citations.py
      - scripts/sync_citations_to_github.py
      - scripts/citations.js
      - scripts/scholar-publications.json
      - tests/test_citations.py
      - tests/citations.test.cjs
      - tests/test_citation_publish.py
      - data/scholar-citations.json
      - data/scholar-citations.js
      - .github/workflows/scholar-citations.yml

permissions:
  contents: read

concurrency:
  group: google-scholar-citations
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check parser, matching, and safe publishing
        run: python -m unittest discover -s tests -p 'test_citation*.py' -v
      - name: Check citation display and fallback
        run: node --test tests/citations.test.cjs
